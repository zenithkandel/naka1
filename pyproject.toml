[project]
name = "border-vision"
version = "2.0.0"
description = "AI-powered pedestrian monitoring and re-identification system"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.0.0",
    "boxmot>=10.0.0",
    "opencv-python>=4.8.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "numpy>=1.24.0",
    "onnxruntime-openvino>=1.15.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
border-vision = "border_vision.main:main"

[tool.setuptools.packages.find]
where = ["backend/src"]
